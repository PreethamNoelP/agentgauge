[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgauge"
dynamic = ["version"]
description = "Find the dangerous things your AI agent can do without asking a human: a static scanner for MCP servers and agent tool code."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Preetham Noel P" }]
keywords = [
    "mcp",
    "ai-agents",
    "security",
    "static-analysis",
    "governance",
    "linter",
    "owasp",
    "llm",
    "prompt-injection",
    "langchain",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
# The scanner itself has no runtime dependencies; this is only for
# `pip install -e .[dev]` when working on agentgauge. mypy is here because
# the package ships py.typed: that marker is a promise to anyone writing a
# third-party rule, and an unchecked promise is how it silently stops being
# true. ruff replaces nothing a human was doing reliably by hand.
#
# Pinned exactly: an unpinned linter turns a new upstream release into a red
# build on a commit that changed nothing. Dependabot (.github/dependabot.yml)
# proposes each upgrade as its own reviewable PR.
dev = ["pytest==9.1.1", "mypy==2.4.0", "ruff==0.16.10"]

[project.urls]
Homepage = "https://github.com/PreethamNoelP/agentgauge"
Issues = "https://github.com/PreethamNoelP/agentgauge/issues"
Changelog = "https://github.com/PreethamNoelP/agentgauge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/PreethamNoelP/agentgauge/blob/main/RULES.md"
Source = "https://github.com/PreethamNoelP/agentgauge"
Security = "https://github.com/PreethamNoelP/agentgauge/blob/main/SECURITY.md"

[project.scripts]
agentgauge = "agentgauge.cli:main"

[tool.setuptools]
packages = ["agentgauge", "agentgauge.rules"]

[tool.setuptools.package-data]
# PEP 561 marker: agentgauge is fully annotated, so a consumer writing a
# third-party rule against FileContext gets real type checking.
agentgauge = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "agentgauge.__version__" }

[tool.agentgauge]
# agentgauge scans itself in CI. tests/ and benchmarks/ are excluded: the
# fixtures and the benchmark corpus are deliberately vulnerable scanner
# input, gated separately (clean fixture must score 100, vulnerable one
# must fail, the corpus must match its labels).
exclude = ["tests/*", "benchmarks/*"]

[tool.ruff]
target-version = "py311"
line-length = 88
# tests/fixtures/*.py are scanner *input*, not runnable code: they
# deliberately reference undefined names (mcp.tool, request_approval,
# process_next) because they are only ever parsed by ast.parse, never
# imported or executed. Linting them reports 33 F821s that are the point of
# the files. Everything else, including the tests themselves, is linted.
extend-exclude = ["tests/fixtures", "benchmarks/corpus"]

[tool.mypy]
python_version = "3.11"
strict = true
# agentgauge ships a py.typed marker, which promises downstream consumers --
# anyone writing a third-party rule against FileContext -- that these
# annotations are real. CI enforces that promise instead of just making it.
files = ["agentgauge"]
