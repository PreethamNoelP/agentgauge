[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgauge"
dynamic = ["version"]
description = "Static governance scanner for MCP servers and AI agent tool-calling code — a linter for the OWASP Agentic Top 10."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Preetham Noel P" }]
keywords = [
    "mcp",
    "ai-agents",
    "security",
    "static-analysis",
    "governance",
    "linter",
    "owasp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
# The scanner itself has no runtime dependencies; this is only for
# `pip install -e .[dev]` when working on agentgauge. mypy is here because
# the package ships py.typed: that marker is a promise to anyone writing a
# third-party rule, and an unchecked promise is how it silently stops being
# true. ruff replaces nothing a human was doing reliably by hand.
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/PreethamNoelP/agentgauge"
Issues = "https://github.com/PreethamNoelP/agentgauge/issues"
Changelog = "https://github.com/PreethamNoelP/agentgauge/blob/main/CHANGELOG.md"
Documentation = "https://github.com/PreethamNoelP/agentgauge/blob/main/RULES.md"

[project.scripts]
agentgauge = "agentgauge.cli:main"

[tool.setuptools]
packages = ["agentgauge", "agentgauge.rules"]

[tool.setuptools.package-data]
# PEP 561 marker: agentgauge is fully annotated, so a consumer writing a
# third-party rule against FileContext gets real type checking.
agentgauge = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "agentgauge.__version__" }

[tool.agentgauge]
# agentgauge scans itself in CI. tests/ is excluded because its
# subprocess.run() calls invoke the CLI under test -- that is a test
# harness, not agent tool-calling code -- and tests/fixtures/ is
# deliberately vulnerable by design. CI gates the fixtures separately:
# the clean one must score 100, the vulnerable one must exit 1.
#
# docs/vendor/ is excluded for both of those reasons at once. It holds a
# synced copy of the package (scanning it would double-count every module
# against itself) and the playground's demo inputs, one of which is
# deliberately vulnerable in exactly the way tests/fixtures is. Without
# this the self-scan reports 49 findings and FAIL_CRITICAL against its own
# documentation directory.
exclude = ["tests/*", "docs/vendor/*"]

[tool.ruff]
target-version = "py311"
line-length = 88
# tests/fixtures/*.py are scanner *input*, not runnable code: they
# deliberately reference undefined names (mcp.tool, request_approval,
# process_next) because they are only ever parsed by ast.parse, never
# imported or executed. Linting them reports 33 F821s that are the point of
# the files. Everything else, including the tests themselves, is linted.
#
# docs/vendor is excluded for the same reason plus one more: it is a synced
# copy of the package, so linting it reports every finding twice and invites
# someone to "fix" the copy instead of the source it is pinned to.
extend-exclude = ["tests/fixtures", "docs/vendor"]

[tool.mypy]
python_version = "3.11"
strict = true
# agentgauge ships a py.typed marker, which promises downstream consumers --
# anyone writing a third-party rule against FileContext -- that these
# annotations are real. CI enforces that promise instead of just making it.
files = ["agentgauge"]
